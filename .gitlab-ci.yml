# This file is a template, and might need editing before it works on your project.
# Official framework image. Look for the different tagged releases at:
# https://hub.docker.com/r/library/php
image: registry.gitlab.com/srico.net/maratee

variables:
  MYSQL_DATABASE: maratee
  MYSQL_ROOT_PASSWORD: root

# This folder is cached between builds
# http://docs.gitlab.com/ce/ci/yaml/README.html#cache
cache:
  paths:
    - vendor/
    - node_modules/

# This is a basic example for a gem or script which doesn't use
# services such as redis or postgres
before_script:
  - cd /var/www/code/maratee #your project path

building:
    stage: build
    script:
      - git reset --hard
      - git pull origin core
      - composer install
      - cp .env.testing .env
      - php artisan key:generate
      - php artisan migrate --seed
      - php artisan cache:clear
      - php artisan config:clear
      - php artisan storage:link
      - sudo chown -R deployer:www-data /var/www/code/maratee
      - find /var/www/code/maratee -type f -exec chmod 664 {} \;
      - find /var/www/code/maratee -type d -exec chmod 775 {} \;
      - chgrp -R www-data storage bootstrap/cache
      - chmod -R ug+rwx storage bootstrap/cache

testing:
    stage: test
    script:
      - php ./vendor/bin/phpunit

deploying:
    stage: deploy
    script:
      - echo "Deployed"
      - php artisan queue:restart #if you use queue
